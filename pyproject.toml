[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyperf-ai-cli"
version = "1.0.0"
description = "🔥 Lightweight Terminal Python Code Performance Intelligence Engine"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "gitstq"}]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Debuggers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
keywords = ["performance", "profiling", "python", "ai", "optimization", "cli"]

[project.scripts]
pyperf-ai = "pyperf_ai.cli:main"

[project.urls]
Homepage = "https://github.com/gitstq/PyPerf-AI-CLI"
Issues = "https://github.com/gitstq/PyPerf-AI-CLI/issues"
